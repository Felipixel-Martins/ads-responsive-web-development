<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Calculadora Científica - Trabalho do Curso</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div class="calculator">
        <div class="display">
            <div class="previous-operand" id="previousOperand"></div>
            <div class="current-operand" id="currentOperand">0</div>
        </div>
        
        <div class="buttons">
            <!-- Linha 1: Funções e operadores -->
            <button class="function" data-action="clear">C</button>
            <button class="function" data-action="percent">%</button>
            <button class="function" data-operator="/">÷</button>
            <button class="operator" data-action="delete">⌫</button>


            
            <!-- Linha 2: Números 7,8,9 e multiplicação -->
            <button class="number" data-number="7">7</button>
            <button class="number" data-number="8">8</button>
            <button class="number" data-number="9">9</button>
            <button class="operator" data-operator="*">×</button>
            
            <!-- Linha 3: Números 4,5,6 e subtração -->
            <button class="number" data-number="4">4</button>
            <button class="number" data-number="5">5</button>
            <button class="number" data-number="6">6</button>
            <button class="operator" data-operator="-">-</button>
            
            <!-- Linha 4: Números 1,2,3 e adição -->
            <button class="number" data-number="1">1</button>
            <button class="number" data-number="2">2</button>
            <button class="number" data-number="3">3</button>
            <button class="operator" data-operator="+">+</button>
            
            <!-- Linha 5: Zero, ponto, igual e funções científicas -->
            <button class="number span-2" data-number="0">0</button>
            <button class="number" data-number=".">.</button>
            <button class="equals" data-action="equals">=</button>
            
            <!-- Linha 6: Funções científicas -->
            <button class="function" data-function="sqrt">√</button>
            <button class="function" data-function="square">x²</button>
            <button class="function" data-function="power">xʸ</button>
            <button class="function" data-function="pi">π</button>
        </div>
    </div>

    <script src="script.js"></script>
</body>
</html>
